# The placeholder's nginx configuration: the page, security headers, and the
# health paths the stamp probes.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;

    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Every path shows the page, so a hostname answers the same wherever it
    # points.
    location / {
        try_files $uri /index.html;
    }

    # nginx serves the page itself, so it is alive and ready as soon as it
    # answers.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
